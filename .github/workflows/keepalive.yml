# Renderの無料プランは15分アクセスがないとサーバーが眠り、起こすのに30秒以上かかる。
# LINEはそこまで待たないので、眠っている間のメッセージは返事が返らない。
# 10分おきに叩いて起こし続けることで、常に即答できる状態を保つ。
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the Render service
        run: curl -sS -m 60 -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" https://linebot-tilt.onrender.com/healthz
